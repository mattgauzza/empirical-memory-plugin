name: Manifests

on:
  push:
    branches: [main]
  pull_request:

jobs:
  check:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: '22'

      # Fails if any committed manifest drifts from meta/manifests.json.
      # Fix locally with: node scripts/build-manifests.mjs
      - name: Manifests match meta/manifests.json
        run: node scripts/build-manifests.mjs --check

      # Fails if any SKILL.md frontmatter is invalid YAML or lacks name/description.
      # `claude plugin validate --strict` does not catch this (empirical-voice 1.0.1).
      - name: SKILL.md frontmatter parses
        run: |
          npm install --no-save yaml@2.8.1
          node scripts/check-skills.mjs

      - name: Install Claude Code
        run: npm install -g @anthropic-ai/claude-code

      # Same validator the plugin-directory review pipeline runs.
      # --strict so unknown fields fail here instead of shipping silently.
      - name: Validate marketplace
        run: claude plugin validate . --strict

      - name: Validate each plugin
        run: |
          for dir in plugins/empirical-work-history plugins/empirical-scar-tissue plugins/empirical-todo plugins/empirical-guided-setup plugins/empirical-voice; do
            echo "--- $dir ---"
            claude plugin validate "$dir" --strict
          done
