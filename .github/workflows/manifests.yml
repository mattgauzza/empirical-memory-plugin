name: Manifests

on:
  push:
    branches: [main]
  pull_request:

jobs:
  check:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: '20'

      # Fails if any committed manifest drifts from meta/manifests.json.
      # Fix locally with: node scripts/build-manifests.mjs
      - name: Manifests match meta/manifests.json
        run: node scripts/build-manifests.mjs --check

      - name: Install Claude Code
        run: npm install -g @anthropic-ai/claude-code

      # Same validator the plugin-directory review pipeline runs.
      # --strict so unknown fields fail here instead of shipping silently.
      - name: Validate marketplace
        run: claude plugin validate . --strict

      - name: Validate each plugin
        run: |
          for dir in plugins/empirical-work-history plugins/empirical-scar-tissue plugins/empirical-todo plugins/empirical-guided-setup; do
            echo "--- $dir ---"
            claude plugin validate "$dir" --strict
          done
